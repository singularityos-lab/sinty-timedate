name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/sinty-timedate ./cmd/sinty-timedate
          tar -C dist -czf "sinty-timedate-${GITHUB_REF_NAME}-x86_64.tar.gz" sinty-timedate
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
